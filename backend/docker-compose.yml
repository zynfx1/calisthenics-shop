services:
  db:
    image: postgres:16-alpine
    container_name: calisthenics-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: calisthenics
      POSTGRES_PASSWORD: calisthenics
      POSTGRES_DB: calisthenics_shop
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
